name: Release ZIP

on:
  push:
    tags:
      - "*-v*"

concurrency:
  # registry.json is a single shared file every run in this workflow writes
  # to — without this, tags pushed close together race on `git push origin
  # HEAD:main`, and the loser's write is silently dropped by `|| true`.
  # Queueing (not cancelling) means every release still lands, just one at
  # a time instead of racing.
  group: dune-themes-registry-write
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Parse release tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^(.+)-v([0-9]+\.[0-9]+\.[0-9]+([-+][^ ]+)?)$ ]]; then
            echo "Tag must match {slug}-v{semver}, got: $TAG"
            exit 1
          fi
          echo "slug=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - run: deno task sync:manifests

      - name: Validate demo (if present)
        run: deno task demo:validate ${{ steps.tag.outputs.slug }}

      - run: deno task pack ${{ steps.tag.outputs.slug }}

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.tag.outputs.slug }} v${{ steps.tag.outputs.version }}
          files: dist/${{ steps.tag.outputs.slug }}-${{ steps.tag.outputs.version }}.zip

      - name: Read the uploaded asset's digest
        id: digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This is GitHub's own sha256 of whatever it actually stored for
          # this release — authoritative regardless of which pack step
          # produced the bytes (zips aren't byte-reproducible across runs,
          # so re-hashing a local file here could disagree with what a
          # visitor actually downloads).
          DIGEST=$(gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --json assets --jq '.assets[0].digest' | sed 's/^sha256://')
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "Could not read asset digest for ${{ github.ref_name }}" >&2
            exit 1
          fi
          echo "sha256=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Update registry sha256
        run: deno run -A scripts/update-registry-sha256.ts ${{ steps.tag.outputs.slug }} ${{ steps.digest.outputs.sha256 }}

      - name: Commit registry sha256
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git diff --staged --quiet && exit 0
          git commit -m "Update registry sha256 for ${{ steps.tag.outputs.slug }} v${{ steps.tag.outputs.version }}"
          # Earlier steps (pack, sync:manifests) can leave deno.lock or other
          # tracked files touched as a side effect without staging them —
          # only registry.json's change is meant to land here, and a leftover
          # dirty file blocks `git rebase` below with "cannot rebase: you have
          # unstaged changes", failing the whole retry loop outright. Discard
          # anything that isn't part of the commit we just made.
          git checkout -- .
          # Tag push checks out a detached HEAD, not a branch — push explicitly to main.
          # The concurrency group above means this should always be a
          # fast-forward, but retry with a rebase instead of silently
          # dropping the write if something else touched main in between.
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done
          echo "Failed to push registry.json update for ${{ steps.tag.outputs.slug }} after 5 attempts" >&2
          exit 1

      - run: |
          echo "### Next steps" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Redeploy the demo (Deployments context) and verify \`themes.getdune.org/${{ steps.tag.outputs.slug }}\` live." >> "$GITHUB_STEP_SUMMARY"
          echo "2. Once verified, publish to JSR deliberately: \`gh workflow run publish-jsr.yml -f tag=${{ github.ref_name }}\`." >> "$GITHUB_STEP_SUMMARY"
